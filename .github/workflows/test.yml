name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  test:
    strategy:
      matrix:
        go:
          - 1.26.x
          - 1.27.x
        tags:
          - ""
          - purego
        label:
          - ubuntu-latest
          - ubuntu-24.04-arm

    runs-on: ${{ matrix.label }}

    env:
      PARQUETGODEBUG: tracebuf=1

    steps:
      - uses: actions/checkout@v4

      # Maven exists only to build parquet-cli for TestWriter (PARQUET_GO_TEST_CLI).
      # s4u/setup-maven-action calls stCarolas/setup-maven, which downloads
      # apache-maven-<version>-bin.tar.gz from repo.maven.apache.org. Apache
      # removes old binaries from that mirror (3.9.2 is HTTP 404), so the job
      # died before go test. archive.apache.org keeps the release.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          # Prefix match restores the repository cached by the old setup-maven-action.
          key: ${{ runner.os }}-m2-parquet-cli-1.13.1
          restore-keys: |
            ${{ runner.os }}-m2-parquet-cli-
            ${{ runner.os }}-jdk17-zulu-maven3.9.2-

      - name: Setup Maven
        run: |
          set -euo pipefail
          version=3.9.2
          tarball="$RUNNER_TEMP/apache-maven-${version}-bin.tar.gz"
          url="https://archive.apache.org/dist/maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$url" -o "$tarball"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "${url}.sha512" -o "${tarball}.sha512"
          hash=$(tr -d '[:space:]' < "${tarball}.sha512")
          echo "${hash}  ${tarball}" | sha512sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${version}/bin" >> "$GITHUB_PATH"

      - name: Setup Parquet CLI
        run: |
          set -ex
          wget https://github.com/apache/parquet-java/archive/refs/tags/apache-parquet-1.13.1.tar.gz
          tar -xf apache-parquet-1.13.1.tar.gz
          mvn --file parquet-java-apache-parquet-1.13.1/parquet-cli/pom.xml install -DskipTests
          mvn --file parquet-java-apache-parquet-1.13.1/parquet-cli/pom.xml dependency:copy-dependencies

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download Dependencies
        run: go mod download

      - name: Run Tests
        env:
          TARGET: parquet-java-apache-parquet-1.13.1/parquet-cli/target
        run: >
          PARQUET_GO_TEST_CLI="java -cp $TARGET/parquet-cli-1.13.1.jar:$TARGET/dependency/* org.apache.parquet.cli.Main"
          go test -trimpath -race -tags=${{ matrix.tags }} ./...

      - name: Run Benchmarks
        run: go test -trimpath -tags=${{ matrix.tags }} -run '^$' -bench . -benchtime 1x ./...

  # Test the experimental simd/archsimd code paths on linux/amd64 at the
  # GOAMD64 microarchitecture levels they are intended to be used with.
  simd:
    strategy:
      matrix:
        goamd64:
          - v3
          - v4

    runs-on: ubuntu-latest

    env:
      PARQUETGODEBUG: tracebuf=1
      GOEXPERIMENT: simd
      GOAMD64: ${{ matrix.goamd64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # simd/archsimd requires Go 1.26; its API has breaking changes in
          # later releases, see the SIMD section of the README.
          go-version: 1.26.x

      # GitHub amd64 runners are a mix of CPUs with and without AVX-512;
      # GOAMD64=v4 binaries fail at startup on the latter, so skip the run
      # when the runner cannot execute it.
      - name: Check CPU features
        id: cpu
        run: |
          if [ "${{ matrix.goamd64 }}" = "v4" ] && ! grep -q avx512bw /proc/cpuinfo; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "runner CPU does not support AVX-512, skipping GOAMD64=v4"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Dependencies
        if: steps.cpu.outputs.supported == 'true'
        run: go mod download

      - name: Run Tests
        if: steps.cpu.outputs.supported == 'true'
        run: go test -trimpath -race ./...

      - name: Run Benchmarks
        if: steps.cpu.outputs.supported == 'true'
        run: go test -trimpath -run '^$' -bench . -benchtime 1x ./...

      # The purego+simd combination builds the archsimd code paths with the
      # purego fallbacks for the remaining assembly kernels. The archsimd
      # code is identical to the runs above and the fallbacks are tested by
      # the main job, so compiling (vet also compiles test files) is enough
      # to validate the tag combination.
      - name: Build with purego
        if: steps.cpu.outputs.supported == 'true' && matrix.goamd64 == 'v3'
        run: go vet -tags purego ./...

      # The purego step above does not compile the assembly. This is the
      # default configuration, so clear the job's GOEXPERIMENT=simd.
      - name: Vet
        if: steps.cpu.outputs.supported == 'true' && matrix.goamd64 == 'v3'
        run: GOEXPERIMENT= go vet ./...

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Validate formatting
        run: |
          make format
          git diff --exit-code

  # https://github.com/golangci/golangci-lint/issues/2649
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v3

  #     - uses: actions/setup-go@v3
  #       with:
  #          go-version-file: "go.mod"

  #     - name: golangci-lint
  #       uses: golangci/golangci-lint-action@v3
  #       with:
  #         version: latest

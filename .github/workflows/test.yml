name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  test:
    strategy:
      matrix:
        go:
          - 1.26.x
          - 1.27.x
        tags:
          - ""
          - purego
        label:
          - ubuntu-latest
          - ubuntu-24.04-arm

    runs-on: ${{ matrix.label }}

    env:
      PARQUETGODEBUG: tracebuf=1
      # parquet-cli used by TestWriter through PARQUET_GO_TEST_CLI.
      PARQUET_CLI_VERSION: "1.13.1"

    steps:
      - uses: actions/checkout@v4

      # Maven exists only to build parquet-cli for TestWriter.
      # s4u/setup-maven-action calls stCarolas/setup-maven, which downloads
      # apache-maven-<version>-bin.tar.gz from repo.maven.apache.org. That
      # host dropped 3.9.2 (HTTP 404). The curl of the same tarball from
      # archive.apache.org then fails to connect and the job dies before
      # go test. ubuntu-latest and ubuntu-24.04-arm already have mvn on
      # PATH. The built jars are cached, so a hit does not run Maven, fetch
      # the parquet-java sources, or contact Maven Central.
      - name: Cache parquet-cli
        id: parquet-cli
        uses: actions/cache@v4
        with:
          path: parquet-cli
          key: parquet-cli-${{ env.PARQUET_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Maven repository
        if: steps.parquet-cli.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          # Prefix match restores the repository cached by the old setup-maven-action.
          key: ${{ runner.os }}-m2-parquet-cli-${{ env.PARQUET_CLI_VERSION }}
          restore-keys: |
            ${{ runner.os }}-m2-parquet-cli-
            ${{ runner.os }}-jdk17-zulu-maven3.9.2-

      - name: Setup Parquet CLI
        if: steps.parquet-cli.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mvn -version
          src="parquet-java-apache-parquet-${PARQUET_CLI_VERSION}"
          tarball="${src}.tar.gz"
          url="https://github.com/apache/parquet-java/archive/refs/tags/apache-parquet-${PARQUET_CLI_VERSION}.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 "$url" -o "$tarball"
          tar -xf "$tarball"
          mvn --file "${src}/parquet-cli/pom.xml" install -DskipTests
          mvn --file "${src}/parquet-cli/pom.xml" dependency:copy-dependencies
          mkdir -p parquet-cli/dependency
          cp "${src}/parquet-cli/target/parquet-cli-${PARQUET_CLI_VERSION}.jar" parquet-cli/
          cp -a "${src}/parquet-cli/target/dependency/." parquet-cli/dependency/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download Dependencies
        run: go mod download

      - name: Run Tests
        env:
          TARGET: parquet-cli
        run: >
          PARQUET_GO_TEST_CLI="java -cp $TARGET/parquet-cli-${PARQUET_CLI_VERSION}.jar:$TARGET/dependency/* org.apache.parquet.cli.Main"
          go test -trimpath -race -tags=${{ matrix.tags }} ./...

      - name: Run Benchmarks
        run: go test -trimpath -tags=${{ matrix.tags }} -run '^$' -bench . -benchtime 1x ./...

  # Test GOEXPERIMENT=simd on linux/amd64 at the GOAMD64 levels the
  # archsimd kernels are written for. Go 1.26 compiles those kernels.
  # Go 1.27 keeps the experiment set (callers turn it on for other
  # modules) and builds the assembly kernels instead; see the SIMD
  # section of the README.
  simd:
    strategy:
      matrix:
        go:
          - 1.26.x
          - 1.27.x
        goamd64:
          - v3
          - v4

    runs-on: ubuntu-latest

    env:
      PARQUETGODEBUG: tracebuf=1
      GOEXPERIMENT: simd
      GOAMD64: ${{ matrix.goamd64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      # GitHub amd64 runners are a mix of CPUs with and without AVX-512;
      # GOAMD64=v4 binaries fail at startup on the latter, so skip the run
      # when the runner cannot execute it.
      - name: Check CPU features
        id: cpu
        run: |
          if [ "${{ matrix.goamd64 }}" = "v4" ] && ! grep -q avx512bw /proc/cpuinfo; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "runner CPU does not support AVX-512, skipping GOAMD64=v4"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Dependencies
        if: steps.cpu.outputs.supported == 'true'
        run: go mod download

      # bitpack and jsonlite still ship Go 1.26 archsimd sources. On Go 1.27
      # those files do not compile, so this module's tests never start.
      # Give them the same !go1.27 split used here, in the module cache,
      # until those modules release it. The module index in the build cache
      # is keyed only by the module directory and treats that directory as
      # immutable, so it would keep the pre-patch constraints; drop it.
      - name: Retarget dependency simd build tags
        if: steps.cpu.outputs.supported == 'true' && startsWith(matrix.go, '1.27')
        run: |
          python3 - << 'PY'
          import os, re, subprocess
          from pathlib import Path
          rx = re.compile(r'(!)?goexperiment\.simd\b')
          def rewrite(line):
              def sub(m):
                  if m.group(1):
                      return '(!goexperiment.simd || go1.27)'
                  return '(goexperiment.simd && !go1.27)'
              return rx.sub(sub, line)
          mods = subprocess.check_output(
              ["go", "list", "-m", "-f", "{{.Dir}}",
               "github.com/parquet-go/bitpack",
               "github.com/parquet-go/jsonlite"],
              text=True).split()
          for mod in mods:
              root = Path(mod)
              os.chmod(root, 0o755)
              for p in root.rglob("*"):
                  if not p.is_file() or p.suffix not in {".go", ".s"}:
                      continue
                  os.chmod(p, 0o644)
                  text = p.read_text()
                  lines = text.splitlines(keepends=True)
                  out, changed = [], False
                  for line in lines:
                      if re.match(r'[ \t]*//go:build\b', line) and 'goexperiment.simd' in line and 'go1.27' not in line:
                          line, changed = rewrite(line), True
                      out.append(line)
                  if changed:
                      p.write_text(''.join(out))
                      print("retargeted", p)
          PY
          go clean -cache
          jsonlite=$(go list -f '{{join .GoFiles " "}}' github.com/parquet-go/jsonlite)
          bitpack=$(go list -f '{{join .GoFiles " "}}' github.com/parquet-go/bitpack)
          echo "jsonlite: $jsonlite"
          echo "bitpack: $bitpack"
          case "$jsonlite" in
            *stage1_amd64.go*) echo "jsonlite simd sources still selected"; exit 1 ;;
          esac
          case "$bitpack" in
            *simd_amd64.go*) echo "bitpack simd sources still selected"; exit 1 ;;
          esac

      - name: Run Tests
        if: steps.cpu.outputs.supported == 'true'
        run: go test -trimpath -race ./...

      - name: Run Benchmarks
        if: steps.cpu.outputs.supported == 'true'
        run: go test -trimpath -run '^$' -bench . -benchtime 1x ./...

      # purego combined with the experiment: archsimd kernels on Go 1.26,
      # the purego sources on Go 1.27. Vet compiles the test files too.
      # The purego fallbacks are also covered by the main job.
      - name: Build with purego
        if: steps.cpu.outputs.supported == 'true' && matrix.goamd64 == 'v3'
        run: go vet -tags purego ./...

      # The purego step above does not compile the assembly. This is the
      # default configuration, so clear the job's GOEXPERIMENT=simd.
      - name: Vet
        if: steps.cpu.outputs.supported == 'true' && matrix.goamd64 == 'v3'
        run: GOEXPERIMENT= go vet ./...

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Validate formatting
        run: |
          make format
          git diff --exit-code

  # https://github.com/golangci/golangci-lint/issues/2649
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v3

  #     - uses: actions/setup-go@v3
  #       with:
  #          go-version-file: "go.mod"

  #     - name: golangci-lint
  #       uses: golangci/golangci-lint-action@v3
  #       with:
  #         version: latest

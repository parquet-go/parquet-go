# A pull request is filed under the first matching category.
# Dependency bumps also carry `type: maintenance`, so `dependencies` comes first.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Breaking changes
      labels:
        - breaking change
    - title: New features
      labels:
        - "type: feature"
    - title: Performance
      labels:
        - "type: performance"
    - title: Bug fixes
      labels:
        - "type: bug"
    - title: Documentation
      labels:
        - "type: docs"
    - title: Dependencies
      labels:
        - dependencies
    - title: Maintenance
      labels:
        - "type: maintenance"
    - title: Other changes
      labels:
        - "*"
